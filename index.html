<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Álbum Pokémon de Juanki</title>
  <meta name="theme-color" content="#e3350d" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css" />
  <style>
    .hero {
      background: linear-gradient(160deg, var(--rojo) 0 78%, var(--tinta) 78% 81%, var(--suave) 81%);
      padding: 2.5rem 1.25rem 5.5rem; text-align: center; color: #fff;
    }
    .hero h1 { font-size: clamp(2rem, 8vw, 3.2rem); line-height: 1.05; text-shadow: 0 3px 0 rgba(0,0,0,.2); }
    .hero h1 span { color: var(--amar); }
    .hero p { margin-top: .6rem; font-weight: 700; opacity: .92; }
    .bola {
      width: 96px; height: 96px; margin: 0 auto 1.25rem; border-radius: 50%;
      background: linear-gradient(to bottom, #fff 0 46%, var(--tinta) 46% 54%, #fff 54%);
      border: 5px solid var(--tinta); position: relative; box-shadow: 0 8px 24px rgba(0,0,0,.25);
      animation: bote 2.4s ease-in-out infinite;
    }
    .bola::before { content: ''; position: absolute; inset: 0 0 54% 0; background: var(--rojo); border-radius: 50% 50% 0 0 / 100% 100% 0 0; filter: brightness(1.1); }
    .bola::after {
      content: ''; position: absolute; left: 50%; top: 50%; width: 26px; height: 26px;
      transform: translate(-50%,-50%); background: #fff; border: 5px solid var(--tinta); border-radius: 50%;
    }
    @keyframes bote { 0%,100% { transform: translateY(0) rotate(0) } 50% { transform: translateY(-10px) rotate(-8deg) } }

    .menu { max-width: 520px; margin: -3.5rem auto 0; padding: 0 1.25rem 3rem; display: grid; gap: 1rem; }
    .op {
      display: flex; align-items: center; gap: 1rem; padding: 1.25rem; border-radius: 20px;
      background: #fff; text-decoration: none; color: var(--tinta);
      box-shadow: 0 6px 20px var(--sombra); border: 3px solid var(--tinta); transition: transform .15s;
    }
    .op:active { transform: scale(.98); }
    .op .ico { font-size: 2.4rem; width: 64px; height: 64px; display: grid; place-items: center; border-radius: 16px; flex-shrink: 0; }
    .op h2 { font-size: 1.3rem; }
    .op p { color: var(--gris); font-size: .9rem; margin-top: .15rem; }
    .op.subir .ico { background: #fde8e2; }
    .op.album .ico { background: #e3eefa; }
    .op.tv .ico { background: #fff6d1; }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; margin-top: .5rem; }
    .stat { background: #fff; border-radius: 14px; padding: .8rem .5rem; text-align: center; border: 2px solid var(--borde); }
    .stat b { display: block; font-family: 'Fredoka', sans-serif; font-size: 1.6rem; color: var(--azul); }
    .stat span { font-size: .72rem; font-weight: 800; color: var(--gris); text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="hero">
    <div class="bola"></div>
    <h1>El álbum <span>Pokémon</span><br>de Juanki</h1>
    <p>¡Hazte con todas!</p>
  </div>

  <div class="menu">
    <a class="op subir" href="subir.html">
      <div class="ico">📷</div>
      <div><h2>Añadir cartas</h2><p>Haz una foto a cada carta y guárdala</p></div>
    </a>
    <a class="op album" href="album.html">
      <div class="ico">📖</div>
      <div><h2>Ver el álbum</h2><p>Ordena por tipo, rareza, PS, favoritas…</p></div>
    </a>
    <a class="op tv" href="album.html#pase">
      <div class="ico">▶️</div>
      <div><h2>Pase de diapositivas</h2><p>Todas las cartas a pantalla completa</p></div>
    </a>

    <div class="stats">
      <div class="stat"><b id="s-cartas">–</b><span>Cartas</span></div>
      <div class="stat"><b id="s-tipos">–</b><span>Tipos</span></div>
      <div class="stat"><b id="s-top">–</b><span>Raras+</span></div>
    </div>
    <button class="btn btn-claro" onclick="cerrarSesion()" style="justify-self:center;font-size:.85rem">🔒 Cerrar sesión (pedir PIN otra vez)</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="comun.js"></script>
  <script>
    conPin(() => db.ref(REF_META).on('value', snap => {
      let n = 0, raras = 0; const tipos = new Set();
      snap.forEach(s => {
        const c = s.val(); const cant = Number(c.cantidad) || 1;
        n += cant;
        if (c.tipo) tipos.add(c.tipo);
        if (RAREZAS.indexOf(c.rareza) >= 3) raras += cant;
      });
      document.getElementById('s-cartas').textContent = n;
      document.getElementById('s-tipos').textContent = tipos.size;
      document.getElementById('s-top').textContent = raras;
    }));
  </script>
</body>
</html>
